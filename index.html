<!doctype html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Calculadora</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#334155,#0f172a 60%);font-family:Arial,sans-serif;color:#f8fafc}.calc{width:min(100%,360px);padding:22px;border:1px solid #475569;border-radius:28px;background:#0f172a;box-shadow:0 24px 60px #0008}.brand{color:#94a3b8;font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}.display{min-height:96px;padding:20px 4px;text-align:right;overflow:auto;font-size:52px;font-weight:bold;white-space:nowrap}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:62px;border:0;border-radius:17px;background:#1e293b;color:#f8fafc;font-size:22px;font-weight:bold;cursor:pointer}button:hover{background:#334155}button:active{transform:scale(.96)}button:focus-visible{outline:3px solid #38bdf8}.op{background:#17324a;color:#bae6fd}.op:hover{background:#1e4a6d}.action{background:#3f1d2e;color:#fda4af}.equal{background:#0ea5e9}.equal:hover{background:#0284c7}.zero{grid-column:span 2}.hint{max-width:360px;text-align:center;color:#cbd5e1;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div>
<main class='calc' aria-label='Calculadora'>
<div class='brand'>Calculadora</div>
<output id='display' class='display' aria-live='polite'>0</output>
<div class='keys'>
<button class='action' data-a='clear'>AC</button><button class='action' data-a='del' aria-label='Apagar'>⌫</button><button class='op' data-v='%'>%</button><button class='op' data-v='/'>÷</button>
<button data-v='7'>7</button><button data-v='8'>8</button><button data-v='9'>9</button><button class='op' data-v='*'>×</button>
<button data-v='4'>4</button><button data-v='5'>5</button><button data-v='6'>6</button><button class='op' data-v='-'>−</button>
<button data-v='1'>1</button><button data-v='2'>2</button><button data-v='3'>3</button><button class='op' data-v='+'>+</button>
<button class='zero' data-v='0'>0</button><button data-v='.'>,</button><button class='equal' data-a='eq'>=</button>
</div></main>
<p class='hint'>Teclado: números, +, −, ×, ÷, Enter e Backspace.</p>
</div>
<script>
const display=document.querySelector('#display');let expression='',justCalculated=false;
const op=v=>'+-*/'.includes(v);
function render(v=expression||'0'){display.textContent=v.replaceAll('*','×').replaceAll('/','÷').replace('.',',')}
function add(v){const cut=Math.max(expression.lastIndexOf('+'),expression.lastIndexOf('-'),expression.lastIndexOf('*'),expression.lastIndexOf('/'));const last=expression.slice(cut+1);if(v==='.'&&last.includes('.'))return;if(op(v)){if(!expression&&v!=='-')return;if(op(expression.at(-1)))expression=expression.slice(0,-1);justCalculated=false}else if(justCalculated){expression='';justCalculated=false}expression+=v;render()}
function calculate(){if(!expression||op(expression.at(-1)))return;try{const result=Function('return ('+expression+')')();if(!Number.isFinite(result))throw Error();expression=String(Number(result.toFixed(10)));justCalculated=true;render()}catch{display.textContent='Erro';expression=''}}
document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='clear'){expression='';justCalculated=false;render();return}if(b.dataset.a==='del'){expression=expression.slice(0,-1);render();return}if(b.dataset.a==='eq'){calculate();return}if(b.dataset.v==='%'){if(expression&&!op(expression.at(-1))){expression=String(Number(expression)/100);render()}return}add(b.dataset.v)});
document.addEventListener('keydown',e=>{if('0123456789.+-*/'.includes(e.key))add(e.key);else if(e.key==='Enter'||e.key==='=')calculate();else if(e.key==='Backspace'){expression=expression.slice(0,-1);render()}else if(e.key==='Escape'){expression='';render()}});
</script>
</body></html>
